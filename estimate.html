  src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"

  <style>
    html,
body {
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}
    *{box-sizing:border-box}body{margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f172a;color:#fff}
    .container{max-width:620px;margin:auto;padding-bottom:180px}.top{display:flex;justify-content:space-between;gap:8px;margin-bottom:14px}.link,.clear{padding:10px 12px;border-radius:10px;font-size:13px;font-weight:700}.link{border:1px solid #475569;color:#cbd5e1;text-decoration:none}.clear{border:1px solid #ef4444;background:transparent;color:#fca5a5}
    h1{margin:0 0 5px;font-size:29px}.subtitle{color:#94a3b8;margin-bottom:16px;line-height:1.6}.panel{margin-top:14px;padding:15px;border:1px solid #334155;border-radius:16px;background:#111827}.title{font-size:16px;font-weight:800;margin-bottom:11px}
    button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:default}.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.price-btn{padding:14px 8px;border:1px solid #475569;border-radius:11px;background:#1e293b;color:#cbd5e1;font-weight:800}.price-btn.normal{border-color:#38bdf8;background:#0c4a6e;color:#e0f2fe}.price-btn.premium{border-color:#f59e0b;background:#422006;color:#fde68a}
    .row{display:flex;gap:8px}.search-input,.manual-input{width:100%;min-width:0;padding:14px;border:1px solid #475569;border-radius:10px;background:#1e293b;color:#fff;font-size:16px;outline:none}.search-btn,.green-btn{padding:14px 18px;border:0;border-radius:10px;background:#10b981;color:#052e25;font-weight:800}.help{color:#64748b;font-size:12px;line-height:1.6;margin-top:8px}
    .camera-btn{width:100%;margin-top:11px;padding:15px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:800}.settings-btn{width:100%;margin-top:9px;padding:11px;border:1px solid #475569;border-radius:10px;background:#1e293b;color:#cbd5e1;font-weight:700}#reader{display:none;margin-top:12px;border:2px solid #10b981;border-radius:15px;overflow:hidden;background:#000}#reader video{width:100%!important}#cameraSettings,#manualForm{display:none;margin-top:10px;padding:13px;border:1px solid #475569;border-radius:12px;background:#0f172a}#cameraMessage{color:#94a3b8;font-size:13px;line-height:1.6;margin-top:9px;white-space:pre-wrap}
    .manual-toggle{width:100%;margin-top:13px;padding:14px;border:1px dashed #f59e0b;border-radius:11px;background:#422006;color:#fde68a;font-weight:800}.manual-label{display:block;margin:10px 0 5px;color:#cbd5e1;font-size:13px}.manual-add{width:100%;margin-top:13px;padding:14px;border:0;border-radius:10px;background:#f59e0b;color:#422006;font-weight:800}
    .notice,.error{margin-top:10px;padding:13px;border-radius:11px;font-size:13px;line-height:1.6}.notice{background:#1e293b;color:#cbd5e1}.error{border:1px solid #ef4444;background:#450a0a;color:#fecaca}.candidate,.item{margin-top:9px;padding:14px;border:1px solid #334155;border-radius:13px;background:#1e293b}.maker,.meta{color:#94a3b8;font-size:12px;line-height:1.6}.name{margin-top:3px;font-size:17px;font-weight:800;line-height:1.4}.candidate-price{margin-top:8px;color:#a7f3d0;font-weight:800}.add-btn{width:100%;margin-top:10px;padding:11px;border:0;border-radius:9px;background:#10b981;color:#052e25;font-weight:800}
    .item-top{display:flex;justify-content:space-between;gap:12px}.remove{height:34px;padding:0 10px;border:1px solid #ef4444;border-radius:8px;background:transparent;color:#fca5a5;font-weight:700}.price-line,.subtotal{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid #334155}.unit,.subtotal strong{font-size:20px;font-weight:800}.qty{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;margin-top:12px}.qty button{border:1px solid #475569;border-radius:9px;background:#0f172a;color:#fff;font-size:22px;font-weight:800}.qty input{width:100%;padding:10px;border:1px solid #475569;border-radius:9px;background:#0f172a;color:#fff;text-align:center;font-size:17px;font-weight:800}
    .summary{position:fixed;left:0;right:0;bottom:0;margin:auto;max-width:620px;padding:14px 18px;background:rgba(6,78,59,.98);border:1px solid #10b981;border-radius:16px 16px 0 0;box-shadow:0 -8px 25px rgba(0,0,0,.35)}.sumrow{display:flex;justify-content:space-between;margin-top:5px;color:#d1fae5;font-size:13px}.total{font-size:27px;color:#fff}.empty{padding:16px 8px;text-align:center;color:#64748b;font-size:13px;line-height:1.7}
    @media(max-width:380px){.row{display:block}.search-btn{width:100%;margin-top:8px}.price-grid{grid-template-columns:1fr}}
    .price-btn.retail {
  border-color: #a78bfa;
  background: #4c1d95;
  color: #ede9fe;
}
    button,
a,
input,
select {
  touch-action: manipulation;
}
  </style>
</head>
<body>
<div class="container">
  <div class="top"><a class="link" href="./index.html">商品価格検索へ戻る</a><button class="clear" onclick="clearEstimate()">見積を全削除</button></div>
  <h1>かんたん見積</h1><div class="subtitle">JAN・品番・品名・メーカーから商品を検索できます</div>

  <div class="panel">

  <div class="title">
    見積価格
  </div>

  <div class="price-grid">

    <button
      id="normalBtn"
      class="price-btn normal"
      onclick="setPriceType('normal')"
    >
      通常下代
    </button>

    <button
      id="premiumBtn"
      class="price-btn"
      onclick="setPriceType('premium')"
    >
      プレミアム会員価格
    </button>

    <button
      id="retailBtn"
      class="price-btn"
      onclick="setPriceType('retail')"
    >
      上代
    </button>

  </div>

</div>

  <div class="panel"><div class="title">商品を追加</div>
    <div class="row"><input id="searchInput" class="search-input" placeholder="JAN・品番・品名・メーカー" autocomplete="off"><button class="search-btn" onclick="searchProducts()">検索</button></div>
    <div class="help">完全一致を優先し、部分一致の候補を最大30件表示します。</div>
    <button id="cameraBtn" class="camera-btn" onclick="toggleCamera()">バーコードで商品を追加</button>
    <div id="reader"></div><div id="cameraMessage"></div>
    <button class="settings-btn" onclick="toggleCameraSettings()">読み取れない場合・カメラを変更</button>
    <div id="cameraSettings"><select id="cameraSelect" class="search-input"></select><button class="green-btn" style="width:100%;margin-top:9px" onclick="changeCamera()">選択したカメラに変更</button><button class="settings-btn" onclick="resetCamera()">おすすめ設定に戻す</button></div>
    <button class="manual-toggle" onclick="toggleManualForm()">＋ 商品マスターにない商品を追加</button>
    <div id="manualForm"><div class="title">商品を自由入力</div>
      <label class="manual-label">商品名</label><input id="manualName" class="manual-input" placeholder="例：特注ガラスベース">
      <label class="manual-label">品番・メモ</label><input id="manualCode" class="manual-input" placeholder="例：別注品">
      <label class="manual-label">単価（税抜）</label><input id="manualPrice" class="manual-input" type="number" inputmode="numeric" min="0" placeholder="1500">
      <button class="manual-add" onclick="addManualProduct()">見積に追加して続ける</button>
    </div>
    <div id="searchResults"></div>
  </div>

  <div class="panel"><div class="title">見積商品 <span id="itemCount" class="maker">0商品</span></div><div id="empty" class="empty">商品がまだ追加されていません。</div><div id="items"></div>
  </div>
  <div class="panel">
  <div class="title">
    見積商品
    <span id="itemCount" class="maker">0商品</span>
  </div>

  <div id="empty" class="empty">
    商品がまだ追加されていません。
  </div>

  <div id="items"></div>
</div>


<!-- ここに追加 -->

<div class="panel pdfInputPanel">

  <div class="title">
    見積書を作成
  </div>

  <label class="pdfInputLabel">
    見積先名
  </label>

  <input
    id="pdfCustomerName"
    class="pdfInput"
    type="text"
    placeholder="例：〇〇フラワー 御中"
  >

  <label class="pdfInputLabel">
    発行元
  </label>

  <input
    id="pdfIssuerName"
    class="pdfInput"
    type="text"
    placeholder="例：〇〇フラワー"
  >

  <label class="pdfInputLabel">
    見積日
  </label>

  <input
    id="pdfEstimateDate"
    class="pdfInput"
    type="date"
  >

  <label class="pdfInputLabel">
    見積有効期限
  </label>

  <input
    id="pdfValidity"
    class="pdfInput"
    type="text"
    value="発行日より30日間"
  >

  <label class="pdfInputLabel">
    備考
  </label>

  <textarea
    id="pdfNote"
    class="pdfTextarea"
    placeholder="納期、送料、その他の条件など"
  ></textarea>

  <button
    id="createPdfButton"
    class="createPdfButton"
    onclick="createEstimatePdf()"
  >
    見積書PDFを作成
  </button>

  <div
    id="pdfMessage"
    class="pdfMessage"
  ></div>

</div>
<!-- 見積商品 -->
<div class="panel">
  ...
</div>

<!-- 先ほど追加した入力フォーム -->
<div class="panel pdfInputPanel">
  ...
</div>

<!-- 次に追加するPDF本体 -->
<div id="pdfDocument">
  ...
</div>

<!-- containerを閉じる -->
</div>

</div>
</div>
<div class="summary"><div class="sumrow"><span>商品点数 / 合計数量</span><strong id="countSummary">0点 / 0個</strong></div><div class="sumrow"><span>税抜合計</span><strong id="subtotalSummary">¥0</strong></div><div class="sumrow"><span>消費税10%</span><strong id="taxSummary">¥0</strong></div><div class="sumrow"><span>税込合計</span><strong id="totalSummary" class="total">¥0</strong></div></div>

<script>
const GAS_API_URL="https://script.google.com/macros/s/AKfycbwLlT9NxW6-wJDakrSP8wPhV29UFXcDbWaFEXNAEPv0lkc8cmC15ecQd0go0G1IkYGL/exec";
const CAMERA_KEY="estimatePreferredCamera", TAX_RATE=.10;
let estimateItems=new Map(),priceType="normal",scanner=null,cameraRunning=false,cameras=[],scanLocked=false,lastJan="",activeRequest=0;

function setPriceType(type) {

  if (
    type !== "normal" &&
    type !== "premium" &&
    type !== "retail"
  ) {
    type = "normal";
  }

  priceType = type;

  normalBtn.className =
    "price-btn" +
    (priceType === "normal" ? " normal" : "");

  premiumBtn.className =
    "price-btn" +
    (priceType === "premium" ? " premium" : "");

  retailBtn.className =
    "price-btn" +
    (priceType === "retail" ? " retail" : "");

  renderEstimate();
}
function normalizeJan(v){return String(v||"").replace(/\D/g,"").trim()}
function parsePrice(v){const n=Number(String(v||"").replace(/,/g,"").replace(/[¥円]/g,"").replace(/[^\d.-]/g,""));return Number.isFinite(n)?n:0}
function formatPrice(v){return "¥"+Math.round(Number(v||0)).toLocaleString("ja-JP")}
function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function safeJs(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/[\r\n]/g,"")}
function getPrice(p) {

  // 自由入力商品は入力した単価を固定
  if (p.manual) {
    return parsePrice(
      p.normalPrice || 0
    );
  }

  // 上代
  if (priceType === "retail") {
    return parsePrice(
      p.retailPrice || 0
    );
  }

  // プレミアム会員価格
  if (priceType === "premium") {
    return parsePrice(
      p.premiumPrice ||
      p.normalPrice ||
      0
    );
  }

  // 通常下代
  return parsePrice(
    p.normalPrice || 0
  );
}
function priceLabel() {

  if (priceType === "retail") {
    return "上代";
  }

  if (priceType === "premium") {
    return "プレミアム会員価格";
  }

  return "通常下代";
}

function searchProducts(){const q=searchInput.value.trim();if(!q){showMessage("検索文字を入力してください。",true);return}const token=++activeRequest;searchResults.innerHTML='<div class="notice">商品を検索しています...</div>';jsonp({action:"search",q},data=>{if(token!==activeRequest)return;if(!data||data.error||data.success===false){showMessage(data?.message||"検索できませんでした。",true);return}const products=data.products||[];if(data.exact&&products.length===1){addProduct(products[0]);searchInput.value="";return}renderCandidates(products,q);},()=>showMessage("商品検索APIへ接続できませんでした。",true));}
function renderCandidates(products,q){if(!products.length){showMessage(`「${q}」に該当する商品がありません。`,true);return}searchResults.innerHTML='<div class="help">検索結果 '+products.length+'件</div>'+products.map(p=>`<div class="candidate"><div class="maker">${escapeHtml(p.maker||"")}</div><div class="name">${escapeHtml(p.name||"")}</div><div class="meta">品番：${escapeHtml(p.productCode||"-")}<br>JAN：${escapeHtml(p.jan||"-")}</div><div class="candidate-price">${priceLabel()}：${formatPrice(getPrice(p))}</div><button class="add-btn" onclick='addCandidate(${JSON.stringify(JSON.stringify(p))})'>見積に追加</button></div>`).join("")}
function addCandidate(json){addProduct(JSON.parse(json));searchResults.innerHTML="";searchInput.value=""}
function showMessage(msg,error){searchResults.innerHTML=`<div class="${error?'error':'notice'}">${escapeHtml(msg)}</div>`}
function jsonp(params,success,failure){const cb="cb_"+Date.now()+"_"+Math.random().toString(36).slice(2),s=document.createElement("script"),timer=setTimeout(()=>{cleanup();failure?.()},15000);function cleanup(){clearTimeout(timer);try{delete window[cb]}catch(e){window[cb]=undefined}s.remove()}window[cb]=d=>{cleanup();success(d)};s.onerror=()=>{cleanup();failure?.()};const qs=new URLSearchParams({...params,callback:cb,t:Date.now()});s.src=GAS_API_URL+"?"+qs.toString();document.body.appendChild(s)}

function addProduct(p){if(!p||!p.jan)return;const key=p.jan,item=estimateItems.get(key);estimateItems.set(key,{product:p,quantity:item?item.quantity+1:1});renderEstimate();showMessage(`${p.name||"商品"}を見積に追加しました。`,false)}
function toggleManualForm(){manualForm.style.display=manualForm.style.display==="block"?"none":"block"}
function addManualProduct(){const name=manualName.value.trim(),code=manualCode.value.trim(),price=parsePrice(manualPrice.value);if(!name){alert("商品名を入力してください。");return}if(price<=0){alert("単価を入力してください。");return}const id="manual_"+Date.now()+"_"+Math.random().toString(36).slice(2,8),p={jan:id,productCode:code||"自由入力",name,maker:"自由入力商品",normalPrice:String(price),premiumPrice:String(price),retailPrice:String(price),manual:true};estimateItems.set(id,{product:p,quantity:1});renderEstimate();manualName.value=manualCode.value=manualPrice.value="";manualName.focus()}
function changeQty(key,d){const x=estimateItems.get(key);if(!x)return;x.quantity=Math.max(1,x.quantity+d);estimateItems.set(key,x);renderEstimate()}
function setQty(key,v){const x=estimateItems.get(key);if(!x)return;x.quantity=Math.max(1,parseInt(v,10)||1);estimateItems.set(key,x);renderEstimate()}
function removeItem(key){estimateItems.delete(key);renderEstimate()}
function clearEstimate(){if(!estimateItems.size||confirm("見積商品をすべて削除しますか？")){estimateItems.clear();renderEstimate()}}
function renderEstimate(){empty.style.display=estimateItems.size?"none":"block";items.innerHTML=[...estimateItems].map(([key,x])=>{const p=x.product,unit=getPrice(p),sub=unit*x.quantity,k=safeJs(key);return `<div class="item"><div class="item-top"><div><div class="maker">${escapeHtml(p.maker||"")}</div><div class="name">${escapeHtml(p.name||"")}</div><div class="meta">品番：${escapeHtml(p.productCode||"-")}<br>${p.manual?"自由入力商品":"JAN："+escapeHtml(p.jan||"-")}</div></div><button class="remove" onclick="removeItem('${k}')">削除</button></div><div class="price-line"><span>${priceLabel()}</span><strong class="unit">${formatPrice(unit)}</strong></div><div class="qty"><button onclick="changeQty('${k}',-1)">−</button><input type="number" min="1" value="${x.quantity}" onchange="setQty('${k}',this.value)"><button onclick="changeQty('${k}',1)">＋</button></div><div class="subtotal"><span>小計</span><strong>${formatPrice(sub)}</strong></div></div>`}).join("");itemCount.textContent=estimateItems.size+"商品";let qty=0,subtotal=0;estimateItems.forEach(x=>{qty+=x.quantity;subtotal+=getPrice(x.product)*x.quantity});const tax=Math.floor(subtotal*TAX_RATE);countSummary.textContent=`${estimateItems.size}点 / ${qty.toLocaleString("ja-JP")}個`;subtotalSummary.textContent=formatPrice(subtotal);taxSummary.textContent=formatPrice(tax);totalSummary.textContent=formatPrice(subtotal+tax)}

async function toggleCamera(){cameraRunning?await stopCamera():await startCamera()}
async function startCamera(id=""){cameraBtn.disabled=true;cameraBtn.textContent="カメラを準備しています...";reader.style.display="block";try{scanner=new Html5Qrcode("reader",{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8],verbose:false});cameras=await Html5Qrcode.getCameras();fillCameras();const saved=localStorage.getItem(CAMERA_KEY),source=id||((saved&&cameras.some(c=>c.id===saved))?saved:{facingMode:"environment"});await scanner.start(source,{fps:20,qrbox:(w,h)=>({width:Math.floor(w*.95),height:Math.min(180,Math.floor(h*.45))}),aspectRatio:1.777778,disableFlip:true},onScan,()=>{});cameraRunning=true;cameraBtn.disabled=false;cameraBtn.textContent="カメラを停止";if(typeof source==="string"){localStorage.setItem(CAMERA_KEY,source);cameraSelect.value=source}cameraMessage.textContent="JANバーコード全体を枠内に合わせてください。"}catch(e){scanner=null;cameraRunning=false;cameraBtn.disabled=false;cameraBtn.textContent="バーコードで商品を追加";reader.style.display="none";cameraMessage.textContent="カメラを開始できませんでした。\n"+(e.message||e)}}
function onScan(text){if(scanLocked)return;const jan=normalizeJan(text);if(!jan||jan===lastJan)return;scanLocked=true;lastJan=jan;navigator.vibrate?.(100);jsonp({action:"jan",jan},data=>{if(data?.found&&data.product){addProduct(data.product);cameraMessage.textContent="見積に追加しました："+data.product.name}else{showMessage("商品マスターに登録されていません。JAN："+jan,true)}},()=>showMessage("商品検索APIへ接続できませんでした。",true));setTimeout(()=>{scanLocked=false;lastJan=""},1000)}
function fillCameras(){cameraSelect.innerHTML=cameras.map((c,i)=>`<option value="${escapeHtml(c.id)}">カメラ ${i+1}${c.label?"："+escapeHtml(c.label):""}</option>`).join("");const saved=localStorage.getItem(CAMERA_KEY);if(saved)cameraSelect.value=saved}
async function changeCamera(){const id=cameraSelect.value;if(!id)return;localStorage.setItem(CAMERA_KEY,id);await stopCamera(false);await startCamera(id)}
async function resetCamera(){localStorage.removeItem(CAMERA_KEY);await stopCamera(false);await startCamera()}
function toggleCameraSettings(){cameraSettings.style.display=cameraSettings.style.display==="block"?"none":"block"}
async function stopCamera(show=true){if(scanner&&cameraRunning){try{await scanner.stop();await scanner.clear()}catch(e){}}scanner=null;cameraRunning=false;reader.style.display="none";cameraBtn.disabled=false;cameraBtn.textContent="バーコードで商品を追加";if(show)cameraMessage.textContent="カメラを停止しました。"}

document.getElementById("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")searchProducts()});document.addEventListener("visibilitychange",()=>{if(document.hidden&&cameraRunning)stopCamera(false)});renderEstimate();
</script>
</body>
</html>
