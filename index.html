<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>商品価格検索</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}html,body,button,a,input,select{touch-action:manipulation}body{margin:0;padding:18px;background:#0f172a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}.container{width:100%;max-width:540px;margin:auto;padding-bottom:36px}h1{margin:0 0 5px;font-size:29px}.subtitle{margin-bottom:17px;color:#94a3b8;line-height:1.6}.navGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.navLink{display:block;padding:14px;border:1px solid #475569;border-radius:12px;background:#1e293b;color:#fff;text-align:center;text-decoration:none;font-size:14px;font-weight:800}.estimateLink{border-color:#f59e0b;background:#422006;color:#fde68a}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55}.cameraButton{width:100%;padding:17px;border:0;border-radius:14px;background:#2563eb;color:#fff;font-size:18px;font-weight:800}#reader{display:none;width:100%;margin-top:14px;overflow:hidden;border:2px solid #10b981;border-radius:16px;background:#000}#reader video{width:100%!important}.scanGuide{display:none;margin-top:10px;padding:11px;border:1px solid #166534;border-radius:11px;background:#052e16;color:#bbf7d0;font-size:13px;line-height:1.6;text-align:center}.zoomBox{display:none;margin-top:10px;padding:12px;border:1px solid #334155;border-radius:12px;background:#111827}.zoomGrid{display:grid;grid-template-columns:1fr 90px 1fr;gap:8px}.zoomButton{padding:12px;border:1px solid #475569;border-radius:9px;background:#1e293b;color:#fff;font-size:20px;font-weight:800}.zoomValue{display:flex;align-items:center;justify-content:center;font-weight:800}#message{margin-top:12px;color:#cbd5e1;font-size:14px;line-height:1.7;white-space:pre-wrap}.settingsButton{width:100%;margin-top:11px;padding:13px;border:1px solid #475569;border-radius:12px;background:#1e293b;color:#fff;font-weight:800}#cameraSettings{display:none;margin-top:10px;padding:14px;border:1px solid #334155;border-radius:14px;background:#111827}#cameraSelect{width:100%;padding:13px;border:1px solid #475569;border-radius:10px;background:#1e293b;color:#fff;font-size:16px}.settingsAction{width:100%;margin-top:9px;padding:13px;border:0;border-radius:9px;background:#10b981;color:#052e25;font-weight:800}.resetButton{width:100%;margin-top:8px;padding:12px;border:1px solid #64748b;border-radius:9px;background:transparent;color:#cbd5e1;font-weight:700}.settingsHelp{margin-top:10px;color:#94a3b8;font-size:12px;line-height:1.6}.manualArea{margin-top:16px;padding:15px;border:1px solid #334155;border-radius:15px;background:#111827}.manualTitle{margin-bottom:9px;color:#cbd5e1;font-size:14px;font-weight:800}.manualRow{display:flex;gap:8px}.janInput{min-width:0;flex:1;padding:14px;border:1px solid #475569;border-radius:10px;background:#1e293b;color:#fff;font-size:16px;outline:none}.searchButton{padding:14px 18px;border:0;border-radius:10px;background:#10b981;color:#052e25;font-weight:800}.searching,.errorCard{margin-top:17px;padding:16px;border-radius:12px;line-height:1.7}.searching{background:#1e293b;color:#cbd5e1;text-align:center}.errorCard{border:1px solid #ef4444;background:#450a0a;color:#fecaca}.productCard{margin-top:19px}.maker{color:#94a3b8;font-size:14px}.productName{margin-top:5px;font-size:25px;font-weight:800;line-height:1.4}.productCode{margin:7px 0 17px;color:#94a3b8;font-size:13px;line-height:1.7}.priceCard{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:9px;padding:16px;border:1px solid #334155;border-radius:14px;background:#1e293b}.priceLabel{color:#94a3b8;font-size:14px}.priceValue{font-size:26px;font-weight:800}.premium{border-color:#f59e0b;background:#422006}.premium .priceLabel,.premium .priceValue{color:#fde68a}.retail{border-color:#a78bfa;background:#2e1065}.retail .priceLabel,.retail .priceValue{color:#ede9fe}.nextButton{width:100%;margin-top:12px;padding:15px;border:0;border-radius:11px;background:#10b981;color:#052e25;font-weight:800}.note{margin-top:17px;color:#64748b;font-size:11px;line-height:1.7;text-align:center}@media(max-width:400px){.navGrid{grid-template-columns:1fr}.manualRow{display:block}.searchButton{width:100%;margin-top:8px}}
</style>
</head>
<body>
<main class="container">
<h1>商品価格検索</h1>
<div class="subtitle">JANバーコードを読み取ると、商品の3種類の価格を確認できます。</div>
<div class="navGrid">
  <a class="navLink estimateLink" href="./estimate.html">🧾 見積を作成する</a>
  <a class="navLink" href="./guide.html">？ 使い方・仕様</a>
</div>
<button id="cameraButton" class="cameraButton" type="button" onclick="toggleCamera()">カメラを起動</button>
<div id="reader"></div>
<div id="scanGuide" class="scanGuide">iPhone SE2などは商品から25〜35cm離し、JAN全体を横長の枠内へ合わせてください。</div>
<div id="zoomControls" class="zoomBox">
  <div class="settingsHelp" style="margin:0 0 9px;text-align:center">対応端末のみズーム調整を表示します。近づけず、離して拡大してください。</div>
  <div class="zoomGrid">
    <button class="zoomButton" type="button" onclick="changeZoom(-1)">−</button>
    <div id="zoomValue" class="zoomValue">1.0×</div>
    <button class="zoomButton" type="button" onclick="changeZoom(1)">＋</button>
  </div>
</div>
<div id="message">カメラを起動するか、JANコードを入力してください。</div>
<button class="settingsButton" type="button" onclick="toggleCameraSettings()">読み取れない場合・カメラを変更</button>
<div id="cameraSettings">
  <select id="cameraSelect"><option value="">カメラを起動すると候補が表示されます</option></select>
  <button class="settingsAction" type="button" onclick="changeCamera()">選択したカメラに変更</button>
  <button class="resetButton" type="button" onclick="resetCameraSetting()">おすすめ設定に戻す</button>
  <div class="settingsHelp">Androidの複数カメラ端末は、JANにピントが合う標準カメラを選んでください。選択はこの端末に保存されます。</div>
</div>
<div class="manualArea">
  <div class="manualTitle">カメラで読めない場合はJANコードを入力</div>
  <div class="manualRow">
    <input id="janInput" class="janInput" type="text" inputmode="numeric" autocomplete="off" placeholder="JANコードを入力">
    <button class="searchButton" type="button" onclick="searchFromInput()">検索</button>
  </div>
</div>
<div id="result"></div>
<div class="note">商品マスター全体は端末に保存せず、検索した商品の情報だけを取得します。</div>
</main>
<script>
const GAS_API_URL="https://script.google.com/macros/s/AKfycbwLlT9NxW6-wJDakrSP8wPhV29UFXcDbWaFEXNAEPv0lkc8cmC15ecQd0go0G1IkYGL/exec";
const CAMERA_STORAGE_KEY="productPricePreferredCamera";
let scanner=null,cameraRunning=false,scanLocked=false,cameras=[],lastScannedJan="",activeSearchToken=0;
let videoTrack=null,zoomMin=1,zoomMax=1,zoomStep=.1,currentZoom=1;
const el=id=>document.getElementById(id);

async function toggleCamera(){
  if(cameraRunning){await stopCamera();return}
  await startCamera();
}

async function startCamera(requestedCameraId=""){
  const button=el("cameraButton"),reader=el("reader"),message=el("message");
  button.disabled=true;button.textContent="カメラを準備しています...";reader.style.display="block";el("scanGuide").style.display="block";
  message.textContent="カメラを準備しています。許可画面が出たら許可してください。";
  try{
    if(typeof Html5Qrcode==="undefined")throw new Error("バーコード読取機能を読み込めませんでした");
    scanner=new Html5Qrcode("reader",{
      formatsToSupport:[
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128
      ],
      verbose:false
    });
    cameras=await Html5Qrcode.getCameras();
    if(!cameras||!cameras.length)throw new Error("利用可能なカメラがありません");
    createCameraOptions();
    const saved=localStorage.getItem(CAMERA_STORAGE_KEY);
    let source;
    if(requestedCameraId&&cameraExists(requestedCameraId))source=requestedCameraId;
    else if(saved&&cameraExists(saved))source=saved;
    else source={facingMode:"environment"};

    await scanner.start(
      source,
      {
        fps:10,
        qrbox:(w,h)=>({width:Math.floor(w*.92),height:Math.max(100,Math.min(150,Math.floor(h*.32)))}),
        disableFlip:false
      },
      onScanSuccess,
      ()=>{}
    );

    cameraRunning=true;button.disabled=false;button.textContent="カメラを停止";
    if(typeof source==="string"){
      localStorage.setItem(CAMERA_STORAGE_KEY,source);
      el("cameraSelect").value=source;
    }
    setupZoomCapability();
    message.textContent="JAN全体を枠内へ合わせてください。SE2などは25〜35cm離してお試しください。";
  }catch(error){
    console.error(error);scanner=null;cameraRunning=false;videoTrack=null;
    button.disabled=false;button.textContent="カメラを起動";reader.style.display="none";el("scanGuide").style.display="none";el("zoomControls").style.display="none";
    message.textContent="カメラを開始できませんでした。\n"+(error.message||String(error));
  }
}

function setupZoomCapability(){
  videoTrack=null;el("zoomControls").style.display="none";
  try{
    const video=document.querySelector("#reader video");
    if(!video||!video.srcObject)return;
    const tracks=video.srcObject.getVideoTracks();
    if(!tracks.length)return;
    videoTrack=tracks[0];
    const capabilities=videoTrack.getCapabilities?videoTrack.getCapabilities():{};
    if(!capabilities.zoom)return;
    zoomMin=Number(capabilities.zoom.min||1);zoomMax=Number(capabilities.zoom.max||zoomMin);zoomStep=Number(capabilities.zoom.step||.1);
    const settings=videoTrack.getSettings?videoTrack.getSettings():{};
    currentZoom=Number(settings.zoom||zoomMin);
    updateZoomDisplay();el("zoomControls").style.display="block";
  }catch(error){console.log("Zoom not supported",error);videoTrack=null}
}

async function changeZoom(direction){
  if(!videoTrack)return;
  const next=Math.max(zoomMin,Math.min(zoomMax,currentZoom+zoomStep*direction));
  try{await videoTrack.applyConstraints({advanced:[{zoom:next}]});currentZoom=next;updateZoomDisplay()}catch(error){console.log("Zoom change failed",error)}
}
function updateZoomDisplay(){el("zoomValue").textContent=Number(currentZoom).toFixed(1)+"×"}

async function onScanSuccess(decodedText){
  if(scanLocked)return;
  const jan=normalizeJan(decodedText);
  if(!jan)return;
  scanLocked=true;lastScannedJan=jan;navigator.vibrate?.(120);

  /* 1回読んだ時点でカメラ停止。連続して数量が増えるのを防止 */
  if(scanner&&cameraRunning){
    try{await scanner.stop();await scanner.clear()}catch(error){console.error(error)}
  }
  scanner=null;cameraRunning=false;videoTrack=null;
  el("reader").style.display="none";el("scanGuide").style.display="none";el("zoomControls").style.display="none";
  el("cameraButton").disabled=false;el("cameraButton").textContent="次の商品を読み取る";
  el("janInput").value=jan;
  el("message").textContent="✓ JANを読み取りました："+jan+"\n商品情報を検索しています...";

  searchProductByJan(jan,true);
}

function searchFromInput(){searchProductByJan(el("janInput").value,false)}

function searchProductByJan(value,fromCamera){
  const jan=normalizeJan(value);
  if(!jan){showError("JANコードを入力してください。");unlockScan();return}
  const token=++activeSearchToken;
  el("result").innerHTML=`<div class="searching">商品情報を検索しています...<br><br>JAN：${escapeHtml(jan)}</div>`;
  jsonp(
    {action:"jan",jan},
    data=>{
      if(token!==activeSearchToken)return;
      if(data&&data.found&&data.product){
        showProduct(data.product);
        el("message").textContent=(fromCamera?"✓ 読み取りました\n":"")+data.product.name;
      }else{
        el("result").innerHTML=`<div class="errorCard">商品マスターに登録されていません。<br><br>JAN：${escapeHtml(jan)}</div>`;
        el("message").textContent="JANは確認できましたが、商品が見つかりませんでした。";
      }
      unlockScan();
    },
    ()=>{
      if(token!==activeSearchToken)return;
      showError("商品検索APIへ接続できませんでした。");unlockScan();
    }
  );
}

function unlockScan(){scanLocked=false;lastScannedJan=""}

function jsonp(params,success,failure){
  const callback="janCallback_"+Date.now()+"_"+Math.random().toString(36).slice(2),script=document.createElement("script");
  const timer=setTimeout(()=>{cleanup();failure?.()},15000);
  function cleanup(){clearTimeout(timer);try{delete window[callback]}catch(error){window[callback]=undefined}script.remove()}
  window[callback]=data=>{cleanup();success(data)};
  script.onerror=()=>{cleanup();failure?.()};
  script.src=GAS_API_URL+"?"+new URLSearchParams({...params,callback,t:Date.now()});
  document.body.appendChild(script);
}

function showProduct(product){
  const premium=product.premiumPrice?formatPrice(product.premiumPrice):"未設定";
  el("result").innerHTML=`
    <div class="productCard">
      <div class="maker">${escapeHtml(product.maker||"")}</div>
      <div class="productName">${escapeHtml(product.name||"")}</div>
      <div class="productCode">品番：${escapeHtml(product.productCode||"-")}<br>JAN：${escapeHtml(product.jan||"-")}</div>
      <div class="priceCard retail"><div class="priceLabel">上代</div><div class="priceValue">${formatPrice(product.retailPrice)}</div></div>
      <div class="priceCard"><div class="priceLabel">通常下代</div><div class="priceValue">${formatPrice(product.normalPrice)}</div></div>
      <div class="priceCard premium"><div class="priceLabel">★ プレミアム会員価格</div><div class="priceValue">${premium}</div></div>
      <button class="nextButton" type="button" onclick="prepareNextProduct()">次の商品を読み取る</button>
    </div>`;
}

function prepareNextProduct(){
  activeSearchToken++;unlockScan();el("result").innerHTML="";el("janInput").value="";el("message").textContent="カメラを起動するか、JANコードを入力してください。";el("cameraButton").textContent="カメラを起動";
}
function showError(message){el("result").innerHTML=`<div class="errorCard">${escapeHtml(message)}</div>`;el("message").textContent="商品を検索できませんでした。"}
function cameraExists(id){return cameras.some(camera=>camera.id===id)}
function createCameraOptions(){
  const select=el("cameraSelect");
  select.innerHTML=cameras.map((camera,index)=>`<option value="${escapeHtml(camera.id)}">カメラ ${index+1}${camera.label?"："+escapeHtml(camera.label):""}</option>`).join("");
  const saved=localStorage.getItem(CAMERA_STORAGE_KEY);if(saved&&cameraExists(saved))select.value=saved;
}
async function changeCamera(){
  const id=el("cameraSelect").value;if(!id)return;
  localStorage.setItem(CAMERA_STORAGE_KEY,id);await stopCamera(false);await startCamera(id);
}
async function resetCameraSetting(){
  localStorage.removeItem(CAMERA_STORAGE_KEY);await stopCamera(false);await startCamera();
}
function toggleCameraSettings(){const box=el("cameraSettings");box.style.display=box.style.display==="block"?"none":"block"}
async function stopCamera(showMessage=true){
  if(scanner&&cameraRunning){try{await scanner.stop();await scanner.clear()}catch(error){console.error(error)}}
  scanner=null;cameraRunning=false;videoTrack=null;el("reader").style.display="none";el("scanGuide").style.display="none";el("zoomControls").style.display="none";
  el("cameraButton").disabled=false;el("cameraButton").textContent="カメラを起動";
  if(showMessage)el("message").textContent="カメラを停止しました。";
}
function normalizeJan(value){return String(value||"").replace(/\D/g,"").trim()}
function formatPrice(value){
  if(value===""||value===null||value===undefined)return"-";
  const number=Number(String(value).replace(/,/g,"").replace(/[¥円]/g,"").trim());
  return Number.isNaN(number)?escapeHtml(value):"¥"+number.toLocaleString("ja-JP");
}
function escapeHtml(value){return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}

el("janInput").addEventListener("keydown",event=>{if(event.key==="Enter")searchFromInput()});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&cameraRunning)stopCamera(false)});
</script>
</body>
</html>
