<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>カメラテスト</title>

  <style>
    body {
      font-family: sans-serif;
      background: #0f172a;
      color: white;
      padding: 20px;
      margin: 0;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    button {
      width: 100%;
      padding: 18px;
      border: 0;
      border-radius: 12px;
      background: #10b981;
      color: #06281f;
      font-size: 18px;
      font-weight: bold;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 16px;
      background: black;
    }

    #message {
      margin-top: 20px;
      white-space: pre-wrap;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>カメラテスト</h1>

  <p>
    iPhone / Android カメラ動作確認
  </p>

  <button onclick="startCamera()">
    カメラを起動
  </button>

  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>

  <div id="message"></div>

</div>

<script>

async function startCamera() {

  const video =
    document.getElementById("video");

  const message =
    document.getElementById("message");


  message.innerText =
    "カメラを起動しています...";


  try {

    if (!navigator.mediaDevices) {

      throw new Error(
        "mediaDevicesが利用できません"
      );

    }


    if (!navigator.mediaDevices.getUserMedia) {

      throw new Error(
        "getUserMediaが利用できません"
      );

    }


    const stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
  facingMode: "environment"
},

        audio: false

      });


    video.srcObject = stream;


    message.innerText =
      "カメラ起動成功";


  } catch (error) {

    message.innerText =
      "カメラ起動失敗\n\n" +
      "エラー：" +
      (error.name || "不明") +
      "\n\n詳細：" +
      (error.message || error);

  }

}

</script>

</body>
</html>
