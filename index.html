<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>商品価格検索</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #0f172a;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding-bottom: 30px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 29px;
    }

    .subtitle {
      margin-bottom: 17px;
      color: #94a3b8;
      line-height: 1.6;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: 0.55;
    }

    .estimateLink {
      display: block;

      width: 100%;
      margin-bottom: 18px;
      padding: 16px;

      border: 1px solid #f59e0b;
      border-radius: 14px;

      background: #422006;
      color: #fde68a;

      text-align: center;
      text-decoration: none;

      font-size: 17px;
      font-weight: bold;
    }

    .estimateLink:active {
      transform: scale(0.98);
    }

    .cameraButton {
      width: 100%;
      padding: 17px;

      border: none;
      border-radius: 14px;

      background: #2563eb;
      color: white;

      font-size: 18px;
      font-weight: bold;
    }

    #reader {
      display: none;

      width: 100%;
      margin-top: 14px;

      overflow: hidden;

      border: 2px solid #10b981;
      border-radius: 16px;

      background: black;
    }

    #reader video {
      width: 100% !important;
    }

    #message {
      margin-top: 13px;

      color: #cbd5e1;

      font-size: 14px;
      line-height: 1.7;

      white-space: pre-wrap;
    }

    .settingsButton {
      width: 100%;

      margin-top: 12px;
      padding: 13px;

      border: 1px solid #475569;
      border-radius: 12px;

      background: #1e293b;
      color: white;

      font-size: 15px;
      font-weight: bold;
    }

    #cameraSettings {
      display: none;

      margin-top: 12px;
      padding: 16px;

      border: 1px solid #334155;
      border-radius: 16px;

      background: #111827;
    }

    .settingsTitle {
      margin-bottom: 11px;

      font-size: 16px;
      font-weight: bold;
    }

    #cameraSelect {
      width: 100%;
      padding: 14px;

      border: 1px solid #475569;
      border-radius: 10px;

      background: #1e293b;
      color: white;

      font-size: 16px;
    }

    .changeButton {
      width: 100%;

      margin-top: 11px;
      padding: 14px;

      border: none;
      border-radius: 10px;

      background: #10b981;
      color: #052e25;

      font-size: 16px;
      font-weight: bold;
    }

    .resetButton {
      width: 100%;

      margin-top: 10px;
      padding: 13px;

      border: 1px solid #64748b;
      border-radius: 10px;

      background: transparent;
      color: #cbd5e1;

      font-size: 14px;
      font-weight: bold;
    }

    .settingsHelp {
      margin-top: 13px;

      color: #94a3b8;

      font-size: 13px;
      line-height: 1.7;
    }

    .manualArea {
      margin-top: 18px;
      padding: 16px;

      border: 1px solid #334155;
      border-radius: 16px;

      background: #111827;
    }

    .manualTitle {
      margin-bottom: 10px;

      color: #cbd5e1;

      font-size: 14px;
      font-weight: bold;
    }

    .manualRow {
      display: flex;
      gap: 8px;
    }

    #janInput {
      min-width: 0;
      flex: 1;

      padding: 14px;

      border: 1px solid #475569;
      border-radius: 10px;

      outline: none;

      background: #1e293b;
      color: white;

      font-size: 16px;
    }

    #janInput:focus {
      border-color: #10b981;
    }

    .searchButton {
      flex-shrink: 0;

      padding: 14px 18px;

      border: none;
      border-radius: 10px;

      background: #10b981;
      color: #052e25;

      font-size: 15px;
      font-weight: bold;
    }

    .searchingCard {
      margin-top: 18px;
      padding: 16px;

      border-radius: 12px;

      background: #1e293b;
      color: #cbd5e1;

      text-align: center;
      line-height: 1.7;
    }

    .productCard {
      margin-top: 20px;
    }

    .productMaker {
      color: #94a3b8;
      font-size: 14px;
    }

    .productName {
      margin-top: 5px;

      font-size: 25px;
      font-weight: bold;
      line-height: 1.4;
    }

    .productCode {
      margin-top: 7px;
      margin-bottom: 18px;

      color: #64748b;

      font-size: 13px;
      line-height: 1.7;
    }

    .priceCard {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;

      margin-top: 10px;
      padding: 17px;

      border: 1px solid #334155;
      border-radius: 15px;

      background: #1e293b;
    }

    .priceLabel {
      color: #94a3b8;
      font-size: 14px;
    }

    .priceValue {
      flex-shrink: 0;

      font-size: 27px;
      font-weight: bold;
    }

    .premiumCard {
      border-color: #f59e0b;
      background: #422006;
    }

    .premiumCard .priceLabel,
    .premiumCard .priceValue {
      color: #fbbf24;
    }

    .errorCard {
      margin-top: 18px;
      padding: 16px;

      border: 1px solid #ef4444;
      border-radius: 12px;

      background: #450a0a;
      color: #fecaca;

      line-height: 1.7;
    }

    .nextButton {
      width: 100%;

      margin-top: 13px;
      padding: 15px;

      border: none;
      border-radius: 12px;

      background: #10b981;
      color: #052e25;

      font-size: 16px;
      font-weight: bold;
    }

    .dataNote {
      margin-top: 18px;

      color: #64748b;

      font-size: 11px;
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 380px) {
      .manualRow {
        display: block;
      }

      .searchButton {
        width: 100%;
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>商品価格検索</h1>

  <div class="subtitle">
    JANバーコードを読み取ると、商品価格をすぐに表示します
  </div>

  <a
    href="./estimate.html"
    class="estimateLink"
  >
    🧾 見積を作成する
  </a>

  <button
    id="cameraButton"
    class="cameraButton"
    onclick="toggleCamera()"
  >
    カメラを起動
  </button>

  <div id="reader"></div>

  <div id="message">
    カメラを起動するか、JANコードを入力してください。
  </div>

  <button
    class="settingsButton"
    onclick="toggleCameraSettings()"
  >
    読み取れない場合・カメラを変更
  </button>

  <div id="cameraSettings">

    <div class="settingsTitle">
      使用するカメラ
    </div>

    <select id="cameraSelect">

      <option value="">
        カメラを起動すると候補が表示されます
      </option>

    </select>

    <button
      class="changeButton"
      onclick="changeCamera()"
    >
      選択したカメラに変更
    </button>

    <button
      class="resetButton"
      onclick="resetCameraSetting()"
    >
      おすすめ設定に戻す
    </button>

    <div class="settingsHelp">
      ピントが合わない場合は、カメラ1・カメラ2・カメラ3を順番に試してください。
      選択したカメラだけ、この端末に記憶します。
    </div>

  </div>

  <div class="manualArea">

    <div class="manualTitle">
      カメラで読めない場合はJANコードを入力
    </div>

    <div class="manualRow">

      <input
        id="janInput"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="JANコードを入力"
      >

      <button
        class="searchButton"
        onclick="searchFromInput()"
      >
        検索
      </button>

    </div>

  </div>

  <div id="result"></div>

  <div class="dataNote">
    商品マスター全体は端末に読み込みません。
    検索した商品の情報だけを取得します。
  </div>

</div>

<script>
  const GAS_API_URL =
    "https://script.google.com/macros/s/AKfycbwLlT9NxW6-wJDakrSP8wPhV29UFXcDbWaFEXNAEPv0lkc8cmC15ecQd0go0G1IkYGL/exec";

  const CAMERA_STORAGE_KEY =
    "productPricePreferredCamera";

  let scanner = null;
  let cameraRunning = false;
  let scanLocked = false;
  let cameras = [];
  let lastScannedJan = "";
  let activeSearchToken = 0;


  async function toggleCamera() {

    if (cameraRunning) {

      await stopCamera();

      return;

    }


    await startCamera();

  }


  async function startCamera(
    requestedCameraId = ""
  ) {

    const button =
      document.getElementById(
        "cameraButton"
      );


    const reader =
      document.getElementById(
        "reader"
      );


    const message =
      document.getElementById(
        "message"
      );


    if (
      typeof Html5Qrcode ===
      "undefined"
    ) {

      message.innerText =
        "バーコード読取機能を読み込めませんでした。";

      return;

    }


    button.disabled =
      true;


    button.innerText =
      "カメラを準備しています...";


    reader.style.display =
      "block";


    message.innerText =
      "カメラの使用確認が表示されたら「許可」を押してください。";


    try {

      scanner =
        new Html5Qrcode(
          "reader",
          {
            formatsToSupport: [
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8
            ],

            verbose: false
          }
        );


      cameras =
        await Html5Qrcode
          .getCameras();


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          "利用可能なカメラが見つかりません"
        );

      }


      createCameraOptions();


      const savedCameraId =
        localStorage.getItem(
          CAMERA_STORAGE_KEY
        );


      let cameraSource;


      if (
        requestedCameraId &&
        cameraExists(
          requestedCameraId
        )
      ) {

        cameraSource =
          requestedCameraId;

      } else if (
        savedCameraId &&
        cameraExists(
          savedCameraId
        )
      ) {

        cameraSource =
          savedCameraId;

      } else {

        cameraSource = {
          facingMode:
            "environment"
        };

      }


      await scanner.start(

        cameraSource,

        {
          fps: 20,

          qrbox:
            function(
              viewfinderWidth,
              viewfinderHeight
            ) {

              return {

                width:
                  Math.floor(
                    viewfinderWidth *
                    0.95
                  ),

                height:
                  Math.min(
                    180,
                    Math.floor(
                      viewfinderHeight *
                      0.45
                    )
                  )

              };

            },

          aspectRatio:
            1.777778,

          disableFlip:
            true
        },

        onScanSuccess,

        function() {
          // 読取失敗フレームは無視
        }

      );


      cameraRunning =
        true;


      button.disabled =
        false;


      button.innerText =
        "カメラを停止";


      if (
        typeof cameraSource ===
        "string"
      ) {

        localStorage.setItem(
          CAMERA_STORAGE_KEY,
          cameraSource
        );


        document
          .getElementById(
            "cameraSelect"
          )
          .value =
          cameraSource;

      }


      message.innerText =
        "JANバーコード全体を枠内に合わせてください。\n" +
        "利用可能なカメラ：" +
        cameras.length +
        "台";


    } catch (error) {

      cameraRunning =
        false;


      scanner =
        null;


      button.disabled =
        false;


      button.innerText =
        "カメラを起動";


      reader.style.display =
        "none";


      message.innerText =
        "カメラを開始できませんでした。\n\n" +
        (
          error &&
          error.message
            ? error.message
            : String(error)
        );

    }

  }


  function onScanSuccess(
    decodedText,
    decodedResult
  ) {

    if (scanLocked) {
      return;
    }


    const jan =
      normalizeJan(
        decodedText
      );


    if (!jan) {
      return;
    }


    if (
      jan === lastScannedJan
    ) {
      return;
    }


    scanLocked =
      true;


    lastScannedJan =
      jan;


    if (
      navigator.vibrate
    ) {

      navigator.vibrate(100);

    }


    document
      .getElementById(
        "janInput"
      )
      .value =
      jan;


    document
      .getElementById(
        "message"
      )
      .innerText =
      "JANコードを読み取りました：" +
      jan;


    searchProductByJan(jan);


    setTimeout(
      function() {

        scanLocked =
          false;

        lastScannedJan =
          "";

      },
      1000
    );

  }


  function searchFromInput() {

    const jan =
      document
        .getElementById(
          "janInput"
        )
        .value;


    searchProductByJan(jan);

  }


  function searchProductByJan(jan) {

    const normalizedJan =
      normalizeJan(jan);


    if (!normalizedJan) {

      showSearchError(
        "JANコードを入力してください。"
      );

      return;

    }


    const searchToken =
      ++activeSearchToken;


    document
      .getElementById(
        "result"
      )
      .innerHTML = `

        <div class="searchingCard">

          商品情報を検索しています...

          <br><br>

          JAN：
          ${escapeHtml(normalizedJan)}

        </div>

      `;


    const callbackName =
      "janCallback_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2, 8);


    const script =
      document.createElement(
        "script"
      );


    const timeoutId =
      setTimeout(
        function() {

          cleanupJsonp(
            callbackName,
            script
          );


          if (
            searchToken !==
            activeSearchToken
          ) {

            return;

          }


          showSearchError(
            "商品検索がタイムアウトしました。通信状態を確認して、もう一度検索してください。"
          );

        },
        15000
      );


    window[callbackName] =
      function(data) {

        clearTimeout(
          timeoutId
        );


        cleanupJsonp(
          callbackName,
          script
        );


        if (
          searchToken !==
          activeSearchToken
        ) {

          return;

        }


        showJanSearchResult(
          data,
          normalizedJan
        );

      };


    script.onerror =
      function() {

        clearTimeout(
          timeoutId
        );


        cleanupJsonp(
          callbackName,
          script
        );


        if (
          searchToken !==
          activeSearchToken
        ) {

          return;

        }


        showSearchError(
          "商品検索APIへ接続できませんでした。"
        );

      };


    script.src =
      GAS_API_URL +
      "?action=jan" +
      "&jan=" +
      encodeURIComponent(
        normalizedJan
      ) +
      "&callback=" +
      encodeURIComponent(
        callbackName
      ) +
      "&t=" +
      Date.now();


    document
      .body
      .appendChild(
        script
      );

  }


  function showJanSearchResult(
    data,
    searchedJan
  ) {

    if (!data) {

      showSearchError(
        "商品情報を取得できませんでした。"
      );

      return;

    }


    if (
      data.error ||
      data.success === false
    ) {

      showSearchError(
        data.message ||
        "商品検索中にエラーが発生しました。"
      );

      return;

    }


    if (
      !data.found ||
      !data.product
    ) {

      document
        .getElementById(
          "result"
        )
        .innerHTML = `

          <div class="errorCard">

            商品マスターに登録されていません。

            <br><br>

            JAN：
            ${escapeHtml(
              searchedJan
            )}

          </div>

        `;


      document
        .getElementById(
          "message"
        )
        .innerText =
        "該当する商品が見つかりませんでした。";


      return;

    }


    showProduct(
      data.product
    );

  }


  function showProduct(data) {

    const premiumPrice =
      data.premiumPrice
        ? formatPrice(
            data.premiumPrice
          )
        : "未設定";


    document
      .getElementById(
        "result"
      )
      .innerHTML = `

        <div class="productCard">

          <div class="productMaker">

            ${escapeHtml(
              data.maker || ""
            )}

          </div>

          <div class="productName">

            ${escapeHtml(
              data.name || ""
            )}

          </div>

          <div class="productCode">

            品番：
            ${escapeHtml(
              data.productCode || "-"
            )}

            <br>

            JAN：
            ${escapeHtml(
              data.jan || "-"
            )}

          </div>

          <div class="priceCard">

            <div class="priceLabel">
              上代
            </div>

            <div class="priceValue">

              ${formatPrice(
                data.retailPrice
              )}

            </div>

          </div>

          <div class="priceCard">

            <div class="priceLabel">
              通常下代
            </div>

            <div class="priceValue">

              ${formatPrice(
                data.normalPrice
              )}

            </div>

          </div>

          <div class="priceCard premiumCard">

            <div class="priceLabel">
              ★ プレミアム会員価格
            </div>

            <div class="priceValue">

              ${premiumPrice}

            </div>

          </div>

          <button
            class="nextButton"
            onclick="prepareNextProduct()"
          >
            次の商品を読み取る
          </button>

        </div>

      `;


    document
      .getElementById(
        "message"
      )
      .innerText =
      "商品が見つかりました。";

  }


  function prepareNextProduct() {

    activeSearchToken++;


    lastScannedJan =
      "";


    scanLocked =
      false;


    document
      .getElementById(
        "result"
      )
      .innerHTML =
      "";


    document
      .getElementById(
        "janInput"
      )
      .value =
      "";


    document
      .getElementById(
        "message"
      )
      .innerText =
      cameraRunning
        ? "次の商品のJANバーコードを枠内に合わせてください。"
        : "カメラを起動するか、JANコードを入力してください。";

  }


  function showSearchError(
    message
  ) {

    document
      .getElementById(
        "result"
      )
      .innerHTML = `

        <div class="errorCard">

          ${escapeHtml(message)}

        </div>

      `;


    document
      .getElementById(
        "message"
      )
      .innerText =
      "商品を検索できませんでした。";

  }


  function cleanupJsonp(
    callbackName,
    script
  ) {

    try {

      delete window[
        callbackName
      ];

    } catch (error) {

      window[
        callbackName
      ] =
        undefined;

    }


    if (
      script &&
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }

  }


  function cameraExists(
    cameraId
  ) {

    return cameras.some(
      function(camera) {

        return (
          camera.id ===
          cameraId
        );

      }
    );

  }


  function createCameraOptions() {

    const select =
      document.getElementById(
        "cameraSelect"
      );


    select.innerHTML =
      "";


    cameras.forEach(
      function(camera, index) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          camera.id;


        option.textContent =
          "カメラ " +
          (index + 1) +
          (
            camera.label
              ? "：" +
                camera.label
              : ""
          );


        select.appendChild(
          option
        );

      }
    );


    const savedCameraId =
      localStorage.getItem(
        CAMERA_STORAGE_KEY
      );


    if (
      savedCameraId &&
      cameraExists(
        savedCameraId
      )
    ) {

      select.value =
        savedCameraId;

    }

  }


  async function changeCamera() {

    const cameraId =
      document
        .getElementById(
          "cameraSelect"
        )
        .value;


    if (!cameraId) {

      document
        .getElementById(
          "message"
        )
        .innerText =
        "変更するカメラを選択してください。";

      return;

    }


    localStorage.setItem(
      CAMERA_STORAGE_KEY,
      cameraId
    );


    await stopCamera(false);

    await startCamera(
      cameraId
    );

  }


  async function resetCameraSetting() {

    localStorage.removeItem(
      CAMERA_STORAGE_KEY
    );


    await stopCamera(false);

    await startCamera();


    document
      .getElementById(
        "message"
      )
      .innerText =
      "おすすめの背面カメラ設定に戻しました。";

  }


  function toggleCameraSettings() {

    const settings =
      document.getElementById(
        "cameraSettings"
      );


    settings.style.display =
      settings.style.display ===
      "block"
        ? "none"
        : "block";

  }


  async function stopCamera(
    showMessage = true
  ) {

    if (
      scanner &&
      cameraRunning
    ) {

      try {

        await scanner.stop();

        await scanner.clear();

      } catch (error) {

        console.error(error);

      }

    }


    scanner =
      null;


    cameraRunning =
      false;


    document
      .getElementById(
        "reader"
      )
      .style.display =
      "none";


    const button =
      document.getElementById(
        "cameraButton"
      );


    button.disabled =
      false;


    button.innerText =
      "カメラを起動";


    if (showMessage) {

      document
        .getElementById(
          "message"
        )
        .innerText =
        "カメラを停止しました。";

    }

  }


  function normalizeJan(value) {

    return String(
      value || ""
    )
      .replace(/\D/g, "")
      .trim();

  }


  function formatPrice(value) {

    if (
      value === "" ||
      value === null ||
      value === undefined
    ) {

      return "-";

    }


    const numberValue =
      Number(
        String(value)

          .replace(/,/g, "")

          .replace(/¥/g, "")

          .replace(/円/g, "")

          .trim()
      );


    if (
      Number.isNaN(
        numberValue
      )
    ) {

      return escapeHtml(
        String(value)
      );

    }


    return "¥" +
      numberValue
        .toLocaleString(
          "ja-JP"
        );

  }


  document
    .getElementById(
      "janInput"
    )
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Enter"
        ) {

          searchFromInput();

        }

      }
    );


  document.addEventListener(
    "visibilitychange",
    async function() {

      if (
        document.hidden &&
        cameraRunning
      ) {

        await stopCamera(false);

      }

    }
  );


  function escapeHtml(text) {

    return String(text)

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");

  }
</script>
